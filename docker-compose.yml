services:
  mikrotik-agent:
    build: .
    container_name: mikrotik-agent
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      APP_TIMEZONE: "Europe/Berlin"
      DATA_DIR: "/data"
      # Optional: set instead of relying on /data/master.key
      # MASTER_KEY: ""
    volumes:
      - ./data:/data
